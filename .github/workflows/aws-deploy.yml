name: Deploy to AWS

on:
  workflow_dispatch:  # Only runs when manually triggered

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Build with Gradle
        run: ./gradlew build -x test
      
      # AWS deployment step requires secrets to be configured:
      # 1. Go to repository Settings > Secrets and variables > Actions
      # 2. Add: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
      # 3. Ensure AWS Elastic Beanstalk app and environment are created
      
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: game-of-war
          environment_name: game-of-war-env
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: build/libs/gameOfWar-1.0-SNAPSHOT.jar

